# Manual / tag-driven release build. Does NOT auto-deploy production.
# Publishing to GHCR requires repository packages:write permissions and login.
name: Release images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push images to GHCR (requires permissions)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build (and optionally publish) images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        run: |
          SHA="${GITHUB_SHA}"
          SHORT="${SHA::12}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="sha-${SHORT}"
          fi
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "api_image=${{ env.REGISTRY }}/${OWNER}/${REPO}-api" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ env.REGISTRY }}/${OWNER}/${REPO}-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.publish }}
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.publish }}
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.version }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
            NEXT_PUBLIC_STT_LANGUAGE=${{ vars.NEXT_PUBLIC_STT_LANGUAGE || 'es-CO' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
