name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PRs: cancel superseded runs. main: never cancel — a production deploy must finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22.16.0'
  PNPM_VERSION: '11.20.0'

jobs:
  quality:
    name: Quality (Prisma + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma 6 reads env("DATABASE_URL") in validate/generate; no connection is made here.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma validate + format gate
        working-directory: apps/api
        run: |
          pnpm exec prisma validate
          pnpm exec prisma format
          git diff --exit-code -- prisma/schema.prisma
      - name: Prisma generate
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @talento/shared build
      - run: pnpm db:generate
      - run: pnpm test

  integration:
    name: Persistence (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: talento_persistence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d talento_persistence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/talento_persistence?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @talento/shared build
      - run: pnpm db:generate
      - name: Migrate deploy (clean CI DB)
        run: pnpm db:migrate:deploy
      - name: Seed RBAC catalog (no DEV users)
        run: pnpm db:seed
      - name: Persistence tests
        run: pnpm test:integration

  e2e:
    name: E2E (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: talento_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d talento_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/talento_ci?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-xx
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-yy
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @talento/shared build
      - run: pnpm db:generate
      - name: Migrate deploy (clean CI DB)
        run: pnpm db:migrate:deploy
      - name: Seed RBAC catalog (no DEV users)
        run: pnpm db:seed
      - name: E2E
        run: pnpm test:e2e

  migrate-gate:
    name: Migration gate (empty DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mig
          POSTGRES_PASSWORD: mig
          POSTGRES_DB: talento_mig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mig -d talento_mig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mig:mig@localhost:5432/talento_mig?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: migrate deploy from empty database
        run: pnpm db:migrate:deploy
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Count applied migrations
        run: |
          PGPASSWORD=mig psql -h localhost -U mig -d talento_mig -c \
            "SELECT COUNT(*) AS migrations FROM _prisma_migrations;"

  build:
    name: Build API + Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Build API
        run: pnpm build:api
        env:
          NODE_ENV: production
      - name: Build Web
        run: pnpm build:web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_STT_LANGUAGE: es-CO

  docker:
    name: Docker build API + Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: talento-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: talento-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
            NEXT_PUBLIC_STT_LANGUAGE=es-CO
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        # Fail on high/critical; document lows as debt.
        run: pnpm audit --audit-level=high

  deploy:
    name: Deploy production
    needs: [quality, unit, integration, e2e, migrate-gate, build, docker, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy SHA to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          DEST="${SSH_USER}@${SSH_HOST}"
          KEY="$HOME/.ssh/deploy_key"
          SSH_BASE=(-i "$KEY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          ssh "${SSH_BASE[@]}" -p "$PORT" "$DEST" 'mkdir -p /tmp/plataforma-hr-ci && chmod 700 /tmp/plataforma-hr-ci'
          scp "${SSH_BASE[@]}" -P "$PORT" \
            scripts/deploy-prod.sh \
            scripts/prod-common.sh \
            scripts/rollback-prod.sh \
            "${DEST}:/tmp/plataforma-hr-ci/"
          ssh "${SSH_BASE[@]}" -p "$PORT" "$DEST" \
            "chmod 700 /tmp/plataforma-hr-ci/*.sh && /tmp/plataforma-hr-ci/deploy-prod.sh '${DEPLOY_SHA}'"
