packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nodemailer@10.0.14

# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) has no release on npm. The only path is
# eslint-config-next > fast-glob > micromatch, used at lint time.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

# Transitive webpack/postcss (Nest CLI, ts-loader) still pulled nanoid 3.3.17 (GHSA-2v37-7h3g-55p8).
# Prisma 6.19.3 (@prisma/config) still pins deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx).
# Nest CLI / ajv resolve fast-uri 4.x. 4.1.3 is GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g.
overrides:
  'nanoid@^3': '3.3.18'
  deepmerge-ts: '>=8.0.1'
  fast-uri: '>=4.2.1'
  sharp: '>=0.35.4'
  'js-yaml@^3': '3.15.2'
  'js-yaml@^4': '4.3.2'
  multer: '>=2.3.0'
  'undici@>=8 <8.11.2': '8.11.2'
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=2 <2.1.7': '2.1.7'
  'brace-expansion@>=4 <5.0.12': '5.0.12'
