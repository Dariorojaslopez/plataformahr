packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nodemailer@10.0.14

# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) has no release on npm. The only path is
# eslint-config-next > fast-glob > micromatch, used at lint time.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

# Transitive webpack/postcss (Nest CLI, ts-loader) still pulled nanoid 3.3.17 (GHSA-2v37-7h3g-55p8).
# Prisma 6.19.3 (@prisma/config) still pins deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx).
# Nest CLI / ajv resolve fast-uri 4.x. 4.1.3 is GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g.
overrides:
  'nanoid@^3': '3.3.18'
  deepmerge-ts: '>=8.0.1'
  fast-uri: '>=4.2.1'
  # sharp <0.35.5 (GHSA-wq5f-xc86-pv6w) via next.
  sharp: '>=0.35.5'
  'js-yaml@^3': '3.15.2'
  'js-yaml@^4': '4.3.2'
  # multer <2.5.0 (GHSA-q7qp-rjg7-q26m).
  multer: '>=2.5.0'
  # undici <8.12.2 (GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm).
  'undici@>=8 <8.12.2': '8.12.2'
  # proxy-addr <2.0.8 (GHSA-jqcg-44mw-7w3h) via express.
  'proxy-addr@<2.0.8': '2.0.8'
  # handlebars <=4.7.9 (GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f) via ts-jest.
  'handlebars@<=4.7.9': '4.7.10'
  # source-map-js <1.2.2 (GHSA-68fv-2mgg-jv7q) via webpack/postcss.
  'source-map-js@<1.2.2': '1.2.2'
  # vite 8.2.0–8.2.3 (GHSA-587h-7wmj-h5pm).
  'vite@>=8.2.0 <8.2.4': '8.2.4'
  # markdown-it <14.3.3 (GHSA-gfr2-rv44-r23c) via prosemirror-markdown.
  'markdown-it@>=14 <14.3.3': '14.3.3'
  # zod <4.6.6 (GHSA-mrhx-c7xc-m3w5) via eslint-plugin-react-hooks.
  'zod@>=4 <4.6.6': '4.6.6'
  # body-parser <2.4.0 (GHSA-27r3-jxmh-p828) via express.
  'body-parser@>=2 <2.4.0': '2.4.0'
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=2 <2.1.7': '2.1.7'
  'brace-expansion@>=4 <5.0.12': '5.0.12'
