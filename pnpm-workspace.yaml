packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Transitive webpack/postcss (Nest CLI, ts-loader) still pulled nanoid 3.3.17 (GHSA-2v37-7h3g-55p8).
# Prisma 6.19.3 (@prisma/config) still pins deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx).
# Nest CLI / ajv still pulled fast-uri <3.1.6 (GHSA-5jgf-p345-68v8 and related).
overrides:
  'nanoid@^3': '3.3.18'
  deepmerge-ts: '>=8.0.1'
  fast-uri: '>=3.1.6'
