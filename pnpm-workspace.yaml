packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Transitive webpack/postcss (Nest CLI, ts-loader) still pulled nanoid 3.3.17 (GHSA-2v37-7h3g-55p8).
overrides:
  'nanoid@^3': '3.3.18'
