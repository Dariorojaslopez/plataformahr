services:
  postgres:
    image: postgres:17
    container_name: talento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talento
      POSTGRES_PASSWORD: talento
      POSTGRES_DB: talento
    ports:
      # Host 5433 avoids clashes with a local PostgreSQL on 5432.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talento -d talento']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
