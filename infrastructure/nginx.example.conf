# Reference reverse proxy (Nginx) for same-origin production topology.
# TLS certificates are terminated here (paths are placeholders — do not commit real certs).
#
# Recommended public shape:
#   https://app.example.com/        → Next.js
#   https://app.example.com/api/    → NestJS (strip or keep prefix according to app design)
#
# Today the SPA calls an absolute NEXT_PUBLIC_API_URL. Two options:
#   A) Cross-origin: api.example.com + CORS + SameSite=None cookies (current default)
#   B) Same-origin:  app.example.com + NEXT_PUBLIC_API_URL=https://app.example.com/api
#      and proxy /api/ → Nest (strip /api). Set COOKIE_PATH=/api/auth so the browser
#      sends tsc_refresh to /api/auth/refresh. Nest routes remain /auth.
#
# This file documents option A (split hosts) and a sketch of B.

upstream talento_web {
  server web:3000;
}

upstream talento_api {
  server api:3001;
}

# --- Option A: split hosts (compatible with Fase 10 cookie defaults) ---

server {
  listen 443 ssl http2;
  server_name app.example.com;

  # ssl_certificate     /etc/nginx/certs/fullchain.pem;
  # ssl_certificate_key /etc/nginx/certs/privkey.pem;

  location / {
    proxy_pass http://talento_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}

server {
  listen 443 ssl http2;
  server_name api.example.com;

  # ssl_certificate     /etc/nginx/certs/fullchain.pem;
  # ssl_certificate_key /etc/nginx/certs/privkey.pem;

  location /metrics {
    # Operational scrape only — deny public access by default.
    deny all;
  }

  location / {
    proxy_pass http://talento_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}

